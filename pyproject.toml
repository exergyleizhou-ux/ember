[project]
name = "ember"
version = "0.1.0"
description = "五层攻防一体的授权安全测试工具包 — 守(漏扫)与攻(授权渗透)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

# Ember 是直接运行的脚本集合,不是可导入的包。
# 显式声明无包可构建,避免 setuptools 在 flat-layout 下因多个顶层目录报错。
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# 攻击 payload 文件里大量"危险"字符串是设计使然,放宽相应规则
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
