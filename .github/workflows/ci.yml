name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        # 仅对已纳入工程化的"守"侧表面强制 lint;ai/ web/ exploits/ 暂为遗留代码
        run: ruff check scanner payloads network run.py tests
      - name: Test
        run: pytest -q
      - name: Smoke installed CLI
        # 验证可分发性:console 入口点能跑,且授权护栏对未授权远程退出非零
        run: |
          ember-scan --help
          if ember-scan -t https://prod.example.com --quick; then
            echo "授权护栏未拦截未授权远程目标" && exit 1
          fi
